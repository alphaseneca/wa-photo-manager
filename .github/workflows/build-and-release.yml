name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript compilation)
        run: npm run build

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: npm run pkg

      - name: Build macOS executables
        if: runner.os == 'macOS'
        run: npm run pkg:macos

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: npm run pkg:linux

      - name: Create distribution package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist-package\photo-manager-windows
          copy photo-manager.exe dist-package\photo-manager-windows\
          copy config.js dist-package\photo-manager-windows\
          copy run-app.bat dist-package\photo-manager-windows\
          copy README.md dist-package\photo-manager-windows\
          copy PACKAGING.md dist-package\photo-manager-windows\
          echo. > dist-package\photo-manager-windows\downloads\.gitkeep

      - name: Create distribution package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-package/photo-manager-macos
          cp photo-manager-macos dist-package/photo-manager-macos/
          cp config.js dist-package/photo-manager-macos/
          cp run-app.sh dist-package/photo-manager-macos/ || true
          cp README.md dist-package/photo-manager-macos/
          cp PACKAGING.md dist-package/photo-manager-macos/
          mkdir -p dist-package/photo-manager-macos/downloads
          touch dist-package/photo-manager-macos/downloads/.gitkeep

      - name: Create distribution package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-package/photo-manager-linux
          cp photo-manager-linux dist-package/photo-manager-linux/
          cp config.js dist-package/photo-manager-linux/
          cp run-app.sh dist-package/photo-manager-linux/ || true
          cp README.md dist-package/photo-manager-linux/
          cp PACKAGING.md dist-package/photo-manager-linux/
          mkdir -p dist-package/photo-manager-linux/downloads
          touch dist-package/photo-manager-linux/downloads/.gitkeep
          chmod +x dist-package/photo-manager-linux/photo-manager-linux

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: photo-manager-windows
          path: dist-package/photo-manager-windows/

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: photo-manager-macos
          path: dist-package/photo-manager-macos/

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: photo-manager-linux
          path: dist-package/photo-manager-linux/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: photo-manager-windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: photo-manager-macos
          path: artifacts/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: photo-manager-linux
          path: artifacts/linux

      - name: Prepare release files
        run: |
          mkdir -p release-files

          # Create Windows zip
          cd artifacts/windows
          zip -r ../../release-files/photo-manager-windows.zip .
          cd ../../

          # Create macOS zip
          cd artifacts/macos
          zip -r ../../release-files/photo-manager-macos.zip .
          cd ../../

          # Create Linux zip
          cd artifacts/linux
          zip -r ../../release-files/photo-manager-linux.zip .
          cd ../../

      - name: Get version from tag
        id: tag_name
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # WhatsApp Photo Manager - Release ${{ steps.tag_name.outputs.VERSION }}

          ## 📦 Packages Available

          ### Windows
          - **photo-manager-windows.zip** - Ready-to-use Windows application
          - Extract and run `run-app.bat`

          ### macOS
          - **photo-manager-macos.zip** - Ready-to-use macOS application
          - Extract and run `./photo-manager-macos`
          - May need to `chmod +x` the executable on first run

          ### Linux
          - **photo-manager-linux.zip** - Ready-to-use Linux application
          - Extract and run `./photo-manager-linux`

          ## 🚀 Quick Start

          1. Download the appropriate package for your OS
          2. Extract the zip file
          3. Edit `config.js` with your authorized phone numbers
          4. Run the application:
             - **Windows:** Double-click `run-app.bat`
             - **macOS/Linux:** Run `./photo-manager-macos` or `./photo-manager-linux`

          ## 📝 Configuration

          Edit `config.js` and update:

          ```javascript
          ALLOWED_NUMBERS: [
              'YOUR_PHONE_NUMBER_1',
              'YOUR_PHONE_NUMBER_2',
          ],
          ```

          ## 📚 Documentation

          - See `README.md` for features and usage
          - See `PACKAGING.md` for troubleshooting and advanced configuration

          ## ✨ Features

          - 🤖 WhatsApp Bot Integration
          - 🔐 Authorization System
          - 📁 Automatic Organization by Phone & Category
          - 📸 Multi-Media Support (Photos, Videos, Documents)
          - 🔄 Automatic Image Conversion (HEIC → JPG)
          - 📊 Detailed Logging

          ## 🐛 Issues

          If you encounter any issues:
          1. Check `config.js` is properly configured
          2. Ensure phone numbers are correct format
          3. Check console output for error messages
          4. Review `PACKAGING.md` troubleshooting section

          ---

          **Release Date:** ${{ github.event.head_commit.timestamp }}
          **Commit:** ${{ github.sha }}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-files/photo-manager-windows.zip
            release-files/photo-manager-macos.zip
            release-files/photo-manager-linux.zip
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Cleanup workflow artifacts
    needs: release
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Delete workflow artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            photo-manager-windows
            photo-manager-macos
            photo-manager-linux
