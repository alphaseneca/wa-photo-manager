name: Release Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Update npm to 12.1.0
        run: npm install --global npm@12.1.0

      - name: Verify runtime versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Assemble standalone application package
        run: powershell -ExecutionPolicy Bypass -File scripts\build-package.ps1

      - name: Install Inno Setup Compiler
        run: choco install innosetup --no-progress

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "1.1.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVer=$ver" scripts\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
